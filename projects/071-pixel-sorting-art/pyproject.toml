[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelsort"
version = "1.0.0"
description = "A glitch-art pixel sorting generator built on NumPy and Pillow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pixelsort = "pixelsort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
