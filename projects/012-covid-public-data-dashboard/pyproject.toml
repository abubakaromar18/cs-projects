[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-dash"
version = "1.0.0"
description = "Clean, analyze and visualize open COVID-19 / public-health time-series data with Pandas and Plotly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "plotly>=5.15"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
covid-dash = "covid_dash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
