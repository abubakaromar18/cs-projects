[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-color-picker"
version = "1.0.0"
description = "Tkinter desktop app to pick colors from the screen and convert between HEX/RGB/HSL/HSV/CMYK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
capture = ["pillow>=10"]
dev = ["pytest>=7", "pillow>=10"]

[project.scripts]
colorpick = "colorpick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
