# Continuous integration: lint -> test (matrix) -> build.
#
# Runs on every push to main and on every pull request. Jobs are ordered with
# `needs:` so a cheap lint failure stops the pipeline before the expensive
# matrix runs, and the build only happens once everything is green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the CI token can only read the repo.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR so the queue stays short.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install linters
        run: python -m pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Let every cell finish so one flaky OS doesn't hide other failures.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: python -m pip install -e ".[test]"
      - name: Run tests with coverage
        run: python -m pytest --cov=slugkit --cov-report=xml --cov-fail-under=90
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  build:
    name: Build distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import slugkit; print(slugkit.slugify('CI Pipeline OK!'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
