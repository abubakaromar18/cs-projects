[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tictactoe-minimax"
version = "1.0.0"
description = "Tic-tac-toe with an unbeatable minimax / alpha-beta AI and a pygame UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pygame>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tictactoe = "tictactoe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
