[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidash"
version = "1.0.0"
description = "A small, safe web dashboard for Raspberry Pi GPIO pins (with a mock backend for development)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pi = ["RPi.GPIO>=0.7"]
dev = ["pytest>=7"]

[project.scripts]
pidash = "pidash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pidash = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
